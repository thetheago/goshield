services:
  traefik:
    image: traefik:v3
    restart: always
    container_name: traefik
    command:
      #- "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myhttpchallenge.acme.httpchallenge=true"
      - "--certificatesresolvers.myhttpchallenge.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myhttpchallenge.acme.email=theago.dev@gmail.com"
      - "--certificatesresolvers.myhttpchallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - './docker/traefik/letsencrypt:/letsencrypt'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.api.service=api@internal"

  goshield:
    build:
      context: .
      dockerfile: ./docker/goshield/Dockerfile
    container_name: goshield
    environment:
      - MASTER_KEY=youshallnotpass
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.http.routers.goshield.rule: "Host(`goshield.localhost`)"
      traefik.http.routers.goshield.entrypoints: "web"
      traefik.http.services.goshield.loadbalancer.server.port: "8080"

networks:
  traefik:
    external: true
